services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: used_market
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/used_market
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      UPLOAD_DIR: uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${HOST_WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
